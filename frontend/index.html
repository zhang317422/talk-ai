<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk AI - English Speaking Practice</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --border: #2a2a2a;
  --text: #e4e4e4;
  --muted: #888;
  --primary: #3b82f6;
  --danger: #f87171;
  --success: #4ade80;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  margin: 0 auto;
  overflow: hidden;
}
header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header h1 { font-size: 18px; font-weight: 600; }
header .api-link { color: var(--muted); font-size: 13px; text-decoration: none; }
header .api-link:hover { color: var(--text); }

.settings-bar {
  display: flex;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  align-items: center;
}
.settings-bar select {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
}
.settings-bar label { font-size: 12px; color: var(--muted); margin-right: -6px; }

.conversation {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.conversation::-webkit-scrollbar { width: 4px; }
.conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 85%;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.msg.user { align-self: flex-end; }
.msg.user .bubble {
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius) var(--radius) 4px var(--radius);
  padding: 10px 14px;
}
.msg.tutor { align-self: flex-start; }
.msg.tutor .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) var(--radius) 4px;
  padding: 10px 14px;
  line-height: 1.55;
}
.msg.tutor .bubble .corrections {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}
.msg.tutor .bubble .corr-item { margin-bottom: 8px; }
.msg.tutor .bubble .corr-mistake { color: var(--danger); }
.msg.tutor .bubble .corr-correct { color: var(--success); }
.msg.tutor .bubble .corr-explain { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
.msg.tutor .speak-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
  margin-top: 6px;
}
.msg.tutor .speak-btn:hover { color: var(--text); border-color: #555; }

.input-area {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
  background: var(--bg);
}
.input-area input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
.input-area input:focus { border-color: var(--primary); }
.input-area.recording input {
  border-color: #dc2626;
  box-shadow: 0 0 0 3px rgba(220,38,38,0.2);
}
.input-area.recording .btn.mic { background: #dc2626; border-color: #dc2626; color: #fff; animation: pulse 1.5s infinite; }
.input-area .preview-text {
  position: absolute;
  bottom: 100%;
  left: 20px;
  right: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
  animation: fadeIn 0.2s ease;
  display: none;
}
.input-area .preview-text.visible { display: block; }
.input-area { position: relative; }
.btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn.send { background: var(--primary); color: #fff; }
.btn.send:hover { background: #2563eb; }
.btn.send:disabled { opacity: 0.4; cursor: default; }
.btn.mic { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.btn.mic:hover { border-color: #555; }
.btn.mic.recording { background: #dc2626; border-color: #dc2626; color: #fff; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); } 50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); } }
.btn.reset { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 14px; }
.btn.reset:hover { color: var(--text); border-color: #555; }

.voice-speed { display: flex; align-items: center; gap: 6px; }
.voice-speed input[type=range] { width: 60px; accent-color: var(--primary); }
.voice-speed span { font-size: 12px; color: var(--muted); min-width: 36px; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  text-align: center;
  padding: 40px;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.6; }
.empty-state .enable-mic-btn {
  margin-top: 16px;
  padding: 12px 28px;
  border-radius: 24px;
  border: 2px solid var(--primary);
  background: transparent;
  color: var(--primary);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s;
}
.empty-state .enable-mic-btn:hover { background: var(--primary); color: #fff; }
.mic-status { margin-top: 10px; font-size: 12px; color: var(--muted); }
.mic-status.ready { color: var(--success); }
.mic-status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
.mic-status .dot.off { background: var(--muted); }
.mic-status .dot.on { background: var(--success); }

.recording-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(220,38,38,0.12);
  pointer-events: none;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
}
.recording-overlay.active { opacity: 1; }
.recording-overlay .hint {
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 16px 32px;
  border-radius: 12px;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.recording-overlay .hint .dot {
  width: 12px; height: 12px;
  background: #dc2626;
  border-radius: 50%;
  animation: pulse 1s infinite;
}

.hint-bar {
  text-align: center;
  padding: 6px;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.hint-bar kbd {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 10px;
  font-family: inherit;
  color: var(--text);
}
</style>
</head>
<body>
<header>
  <h1>Talk AI</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="voice-speed">
      <span id="speedLabel">1.0x</span>
      <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="0.9" oninput="updateSpeed()">
    </div>
    <a href="/api" target="_blank" class="api-link">API Docs</a>
  </div>
</header>

<div class="settings-bar">
  <label for="levelSelect">Level</label>
  <select id="levelSelect">
    <option value="beginner">Beginner</option>
    <option value="intermediate" selected>Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>
  <label for="scenarioSelect">Scenario</label>
  <select id="scenarioSelect">
    <option value="free_talk">Free Talk</option>
    <option value="ordering_food">Ordering Food</option>
    <option value="checking_in">Hotel Check-in</option>
    <option value="asking_directions">Asking Directions</option>
    <option value="job_interview">Job Interview</option>
    <option value="shopping">Shopping</option>
    <option value="at_restaurant">At Restaurant</option>
  </select>
  <button class="btn reset" onclick="resetSession()" title="New Session">R</button>
</div>

<div class="conversation" id="conversation">
  <div class="empty-state" id="emptyState">
    <div class="icon">🎙️</div>
    <p>Welcome to Talk AI<br>Let's practice English speaking together</p>
    <button class="enable-mic-btn" id="enableMicBtn" onclick="enableMic()">Enable Microphone</button>
    <div class="mic-status" id="micStatus"><span class="dot off"></span> Microphone not ready</div>
  </div>
</div>

<div class="recording-overlay" id="recordingOverlay">
  <div class="hint"><span class="dot"></span> Listening...</div>
</div>

<div class="input-area" id="inputArea">
  <div class="preview-text" id="previewText"></div>
  <button class="btn mic" id="micBtn" onclick="toggleMic()" title="Click or hold Space to record" disabled>
    🎤
  </button>
  <input id="msgInput" type="text" placeholder="Type or hold Space to speak..."
         onkeydown="if(event.key==='Enter')sendText()" autofocus />
  <button class="btn send" id="sendBtn" onclick="sendText()">
    ↑
  </button>
</div>

<div class="hint-bar">
  <kbd>Space</kbd> hold to speak &nbsp;|&nbsp; <kbd>Esc</kbd> stop AI &nbsp;|&nbsp; <kbd>Enter</kbd> send text
</div>

<script>
// ── State ──────────────────────────────────────────
let sessionId = crypto.randomUUID();
let speechRate = 0.9;
let recognition = null;
let isRecording = false;
let spaceHeld = false;
let abortController = null;
let micReady = false;
let pendingTranscript = '';
let hasRecognizedSpeech = false;

// ── DOM refs ───────────────────────────────────────
const conversation = document.getElementById('conversation');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const recordingOverlay = document.getElementById('recordingOverlay');
const inputArea = document.getElementById('inputArea');
const previewText = document.getElementById('previewText');

// ── Voice Recognition ──────────────────────────────
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;

  const rec = new SpeechRecognition();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.continuous = false;
  return rec;
}

async function enableMic() {
  // Step 1: get persistent audio permission via getUserMedia
  // Once granted, SpeechRecognition won't prompt again for subsequent starts
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    setMicReady(false);
    return;
  }

  // Step 2: verify SpeechRecognition works
  const rec = initRecognition();
  if (!rec) {
    msgInput.placeholder = 'Speech not supported — type instead';
    return;
  }
  rec.onresult = () => {};
  rec.onend = () => { setMicReady(true); };
  rec.onerror = () => { setMicReady(false); };
  try {
    rec.start();
    rec.stop();
  } catch (e) {
    setMicReady(false);
  }
}

function setMicReady(ready) {
  micReady = ready;
  micBtn.disabled = !ready;
  if (ready) {
    const esIcon = document.querySelector('#emptyState .icon');
    const esP = document.querySelector('#emptyState p');
    if (esIcon) esIcon.textContent = '🗣️';
    if (esP) esP.innerHTML = 'Microphone ready!<br>Hold <kbd>Space</kbd> or click 🎤 to speak';
    const eBtn = document.getElementById('enableMicBtn');
    if (eBtn) eBtn.remove();
    const mStatus = document.getElementById('micStatus');
    if (mStatus) {
      mStatus.className = 'mic-status ready';
      mStatus.innerHTML = '<span class="dot on"></span> Microphone ready';
    }
    msgInput.placeholder = 'Hold Space to speak, or type...';
    msgInput.focus();
  }
}

function startRecording() {
  if (!micReady) return false;
  if (!recognition) {
    recognition = initRecognition();
    if (!recognition) return false;
  }

  recognition.onresult = (e) => {
    pendingTranscript = e.results[0][0].transcript;
    hasRecognizedSpeech = true;
    previewText.textContent = 'Rec: ' + pendingTranscript;
    previewText.classList.add('visible');
  };
  recognition.onend = () => {
    if (spaceHeld) {
      if (hasRecognizedSpeech) {
        previewText.textContent = 'Rec: ' + pendingTranscript + ' (release to send)';
      } else {
        msgInput.placeholder = 'Still listening...';
      }
    } else if (!isRecording) {
      // Already stopped via keyup — nothing to do
      return;
    } else {
      setRecordingUI(false);
      flushTranscript();
    }
  };
  recognition.onerror = (e) => {
    setRecordingUI(false);
    spaceHeld = false;
    pendingTranscript = '';
    hasRecognizedSpeech = false;
    previewText.classList.remove('visible');
    if (e.error !== 'aborted') msgInput.placeholder = 'Mic error — type instead';
  };

  pendingTranscript = '';
  hasRecognizedSpeech = false;
  previewText.classList.remove('visible');

  try {
    recognition.start();
    setRecordingUI(true);
    return true;
  } catch (e) {
    spaceHeld = false;
    return false;
  }
}

function stopRecording() {
  try {
    if (recognition) recognition.stop();
  } catch (e) {
    // ignore — may not have started yet
  }
  setRecordingUI(false);
  spaceHeld = false;
}

function flushTranscript() {
  if (pendingTranscript.trim()) {
    msgInput.value = pendingTranscript;
    sendText();
  }
  pendingTranscript = '';
  hasRecognizedSpeech = false;
  previewText.classList.remove('visible');
}

function setRecordingUI(active) {
  isRecording = active;
  if (active) {
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    msgInput.placeholder = 'Listening...';
    recordingOverlay.classList.add('active');
    inputArea.classList.add('recording');
  } else {
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    recordingOverlay.classList.remove('active');
    inputArea.classList.remove('recording');
    previewText.classList.remove('visible');
  }
}

function toggleMic() {
  if (isRecording) {
    stopRecording();
    flushTranscript();
  } else {
    startRecording();
  }
}

// ── Speech (TTS) ───────────────────────────────────
function speak(text, btn) {
  speechSynthesis.cancel();
  const cleanText = stripCorrections(text);
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.rate = speechRate;
  utterance.lang = 'en-US';

  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utterance.voice = enVoice;

  if (btn) {
    btn.textContent = '🔊';
    utterance.onend = () => { btn.textContent = '🔈'; };
  }
  speechSynthesis.speak(utterance);
}

function stripCorrections(text) {
  const idx = text.indexOf('--- Corrections ---');
  return idx === -1 ? text : text.slice(0, idx).trim();
}

function updateSpeed() {
  speechRate = parseFloat(speedSlider.value);
  speedLabel.textContent = speechRate.toFixed(1) + 'x';
}

// ── Messages ───────────────────────────────────────
function addMessage(role, text, corrections) {
  const es = document.getElementById('emptyState');
  if (es) es.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const content = document.createElement('div');
  content.textContent = stripCorrections(text);
  bubble.appendChild(content);

  if (corrections && corrections.length > 0) {
    const corrDiv = document.createElement('div');
    corrDiv.className = 'corrections';
    corrDiv.innerHTML = corrections.map(c =>
      `<div class="corr-item">
        <span class="corr-mistake">Mistake:</span> ${escapeHtml(c.mistake)}<br>
        <span class="corr-correct">Correct:</span> ${escapeHtml(c.correct)}
        <span class="corr-explain">${escapeHtml(c.explanation)}</span>
      </div>`
    ).join('');
    bubble.appendChild(corrDiv);
  }

  if (role === 'tutor') {
    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔈';
    speakBtn.onclick = () => speak(text, speakBtn);
    bubble.appendChild(speakBtn);
  }

  div.appendChild(bubble);
  conversation.appendChild(div);
  conversation.scrollTop = conversation.scrollHeight;
  return content;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Stop AI ────────────────────────────────────────
function stopAI() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  speechSynthesis.cancel();
}

// ── Send ───────────────────────────────────────────
function getParams() {
  return {
    level: document.getElementById('levelSelect').value,
    scenario: document.getElementById('scenarioSelect').value,
  };
}

async function sendText() {
  const text = msgInput.value.trim();
  if (!text) return;

  addMessage('user', text);
  msgInput.value = '';
  sendBtn.disabled = true;
  msgInput.disabled = true;

  // Abort any in-progress stream
  if (abortController) abortController.abort();
  abortController = new AbortController();

  const params = getParams();
  const tutorMsg = addMessage('tutor', '');

  try {
    const response = await fetch('/api/tutor/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId, ...params }),
      signal: abortController.signal,
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let corrections = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        try {
          const d = JSON.parse(payload);
          if (d.content) {
            fullText += d.content;
            tutorMsg.textContent = stripCorrections(fullText);
          }
          if (d.corrections) {
            corrections = d.corrections;
          }
        } catch(e) {}
      }
    }

    // Rebuild tutor message with corrections
    const msgs = conversation.querySelectorAll('.msg.tutor');
    const lastMsg = msgs[msgs.length - 1];
    if (lastMsg && corrections && corrections.length > 0) {
      const corrDiv = document.createElement('div');
      corrDiv.className = 'corrections';
      corrDiv.innerHTML = corrections.map(c =>
        `<div class="corr-item">
          <span class="corr-mistake">Mistake:</span> ${escapeHtml(c.mistake)}<br>
          <span class="corr-correct">Correct:</span> ${escapeHtml(c.correct)}
          <span class="corr-explain">${escapeHtml(c.explanation)}</span>
        </div>`
      ).join('');
      const bubble = lastMsg.querySelector('.bubble');
      bubble.appendChild(corrDiv);
    }

    // Auto-speak
    if (fullText) {
      speak(fullText, lastMsg?.querySelector('.speak-btn'));
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      tutorMsg.textContent = 'Error: ' + err.message;
    }
  }

  sendBtn.disabled = false;
  msgInput.disabled = false;
  msgInput.focus();
}

// ── Keyboard ───────────────────────────────────────
// Space hold: start recording; release: stop + send transcript
// Esc: stop AI reply + TTS

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Escape') {
    e.preventDefault();
    stopAI();
    stopRecording();
    pendingTranscript = '';
    hasRecognizedSpeech = false;
    previewText.classList.remove('visible');
    setRecordingUI(false);
    spaceHeld = false;
    sendBtn.disabled = false;
    msgInput.disabled = false;
    msgInput.placeholder = 'Hold Space to speak, or type...';
    msgInput.focus();
    return;
  }
  if (e.code !== 'Space') return;
  // Don't intercept space when focused on input with text
  if (document.activeElement === msgInput && msgInput.value.trim()) return;
  if (!spaceHeld && !isRecording && micReady) {
    e.preventDefault();
    spaceHeld = true;
    startRecording();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && spaceHeld) {
    spaceHeld = false;
    setRecordingUI(false);
    stopRecording();
    flushTranscript();
  }
});

// Reset held state when window regains focus (handles permission dialog stealing focus)
window.addEventListener('focus', () => {
  if (spaceHeld && !isRecording) {
    spaceHeld = false;
    pendingTranscript = '';
    previewText.classList.remove('visible');
  }
});

// ── Session ────────────────────────────────────────
function resetSession() {
  if (abortController) abortController.abort();
  speechSynthesis.cancel();
  fetch('/api/tutor/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  sessionId = crypto.randomUUID();
  conversation.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.id = 'emptyState';
  if (micReady) {
    empty.innerHTML = '<div class="icon">🗣️</div><p>New session started<br>Hold <kbd>Space</kbd> or click 🎤 to speak</p>';
  } else {
    empty.innerHTML = '<div class="icon">🎙️</div><p>New session started<br>Let\'s practice English speaking together</p>'
      + '<button class="enable-mic-btn" onclick="enableMic()">Enable Microphone</button>'
      + '<div class="mic-status"><span class="dot off"></span> Microphone not ready</div>';
  }
  conversation.appendChild(empty);
}
</script>
</body>
</html>
